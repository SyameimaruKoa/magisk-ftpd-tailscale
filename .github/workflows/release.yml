name: Build and Release FTPD Modules

on:
    push:
        branches:
            - main
            - master
        paths:
            - 'module/**'
            - 'Tethering_FTPD_Multi-IP/**'
            - '.github/workflows/release.yml'
            - '.github/workflows/ftpd-tailscale-module.yml'
    pull_request:
        paths:
            - 'module/**'
            - 'Tethering_FTPD_Multi-IP/**'
            - '.github/workflows/release.yml'
            - '.github/workflows/ftpd-tailscale-module.yml'
    workflow_dispatch:
        inputs:
            extra_ips:
                description: '追加のターゲットIP（固定IP、ワイルドカード、CIDRサブネット対応。Multi-IP版のみに適用）'
                required: false
                type: string
                default: ''
            draft:
                description: 'ドラフト（非公開）リリースとして作成するかどうか'
                required: false
                type: boolean
                default: true

concurrency:
    group: ftpd-modules-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Update FTPD Tailscale v1.1.0 release notes
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -eu
                  TAG='ftpd-modules-11-d3f99bc'
                  FILES="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[].name] | sort | join(",")')"
                  test "$FILES" = 'FTPD-Tailscale.zip'
                  cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
                  ## 更新内容

                  - アクションの音量上：FTPの一時停止・再開
                  - アクションの音量下：MediaScan
                  - `ftpd.sh scan`による手動スキャンを追加

                  ## 配布ファイル

                  - `FTPD-Tailscale.zip`
                  NOTES
                  gh release edit "$TAG" --title 'FTPD Tailscale v1.1.0' --notes-file "$RUNNER_TEMP/release-notes.md"
            - name: Detect changes against last release per module
              id: detect
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT_NAME: ${{ github.event_name }}
                  EXTRA_IPS: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_ips || '' }}
              run: |
                  set -eu
                  gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/ftpd-releases.json"
                  python3 - <<'PY'
                  import json
                  import os
                  import subprocess

                  with open(os.path.join(os.environ["RUNNER_TEMP"], "ftpd-releases.json"), encoding="utf-8") as stream:
                      releases = json.load(stream)

                  published = sorted(
                      (release for release in releases if not release["draft"]),
                      key=lambda release: release["published_at"] or "",
                      reverse=True,
                  )
                  modules = {
                      "tailscale": ("FTPD-Tailscale.zip", "module"),
                      "multi": ("Tethering_FTPD_Multi-IP.zip", "Tethering_FTPD_Multi-IP"),
                  }
                  changed = {}
                  for key, (filename, path) in modules.items():
                      baseline = next(
                          (
                              release["tag_name"] for release in published
                              if any(asset["name"] == filename for asset in release["assets"])
                          ),
                          None,
                      )
                      if baseline is None:
                          changed[key] = True
                          continue
                      result = subprocess.run(["git", "diff", "--quiet", baseline, "HEAD", "--", path], check=False)
                      if result.returncode > 1:
                          raise SystemExit(f"Cannot compare {path} against release {baseline}")
                      changed[key] = result.returncode == 1

                  if os.environ["EVENT_NAME"] == "workflow_dispatch" and os.environ["EXTRA_IPS"].strip():
                      changed["multi"] = True

                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      for key, value in changed.items():
                          print(f"{key}={str(value).lower()}", file=output)
                      print(f"any={str(any(changed.values())).lower()}", file=output)
                  print("Selected module builds:", changed)
                  PY

            - name: Inject additional IPs for Multi-IP module
              if: steps.detect.outputs.multi == 'true' && github.event_name == 'workflow_dispatch' && inputs.extra_ips != ''
              env:
                  EXTRA_IPS: ${{ inputs.extra_ips }}
              run: |
                  set -eu
                  python3 - <<'PY'
                  import os
                  from pathlib import Path

                  extra_ips = " ".join(os.environ["EXTRA_IPS"].split())
                  allowed = set("0123456789.xX*/ ")
                  if any(char not in allowed for char in extra_ips):
                      raise SystemExit("Invalid extra_ips: only IPv4 patterns, spaces, and / * x X are allowed")
                  path = Path("Tethering_FTPD_Multi-IP/ftpd.service")
                  source = path.read_text(encoding="utf-8")
                  needle = 'TARGET_IPS="'
                  if needle not in source:
                      raise SystemExit("TARGET_IPS definition not found")
                  path.write_text(source.replace(needle, needle + extra_ips + " ", 1), encoding="utf-8")
                  PY

            - name: Validate and build selected ZIPs
              if: steps.detect.outputs.any == 'true'
              env:
                  BUILD_TAILSCALE: ${{ steps.detect.outputs.tailscale }}
                  BUILD_MULTI: ${{ steps.detect.outputs.multi }}
              run: |
                  set -eu

                  if [ "$BUILD_TAILSCALE" = true ]; then
                      for script in module/*.sh; do
                          sh -n "$script"
                      done
                      (
                          cd module
                          zip -r9 ../FTPD-Tailscale.zip .
                      )
                      unzip -t FTPD-Tailscale.zip
                      test "$(unzip -p FTPD-Tailscale.zip module.prop | sed -n 's/^id=//p')" = "ftpd-tailscale"
                  fi

                  if [ "$BUILD_MULTI" = true ]; then
                      for script in Tethering_FTPD_Multi-IP/*.sh Tethering_FTPD_Multi-IP/*.service Tethering_FTPD_Multi-IP/*.inotify; do
                          sh -n "$script"
                      done
                      (
                          cd Tethering_FTPD_Multi-IP
                          zip -r9 ../Tethering_FTPD_Multi-IP.zip .
                      )
                      unzip -t Tethering_FTPD_Multi-IP.zip
                      test "$(unzip -p Tethering_FTPD_Multi-IP.zip module.prop | sed -n 's/^id=//p')" = "tethering-ftpd-inotify"
                  fi

            - name: Upload selected module ZIPs as build artifacts
              if: steps.detect.outputs.any == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: FTPD-Modules
                  path: |
                      FTPD-Tailscale.zip
                      Tethering_FTPD_Multi-IP.zip
                  if-no-files-found: error

            - name: Publish Release with changed modules only
              if: github.event_name != 'pull_request' && steps.detect.outputs.any == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  IS_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == true && 'true' || 'false' }}
                  EXTRA_IPS: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_ips || '' }}
                  BUILD_TAILSCALE: ${{ steps.detect.outputs.tailscale }}
                  BUILD_MULTI: ${{ steps.detect.outputs.multi }}
              run: |
                  set -eu
                  TAG="ftpd-modules-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
                  ASSETS=()

                  if [ "$BUILD_TAILSCALE" = true ]; then
                      TAILSCALE_VERSION="$(sed -n 's/^version=//p' module/module.prop | tr -d '\r')"
                      ASSETS+=("FTPD-Tailscale.zip")
                  fi
                  if [ "$BUILD_MULTI" = true ]; then
                      MULTI_VERSION="$(sed -n 's/^version=//p' Tethering_FTPD_Multi-IP/module.prop | tr -d '\r')"
                      ASSETS+=("Tethering_FTPD_Multi-IP.zip")
                  fi

                  if [ "$BUILD_TAILSCALE" = true ] && [ "$BUILD_MULTI" = true ]; then
                      TITLE="FTPD Modules (Tailscale $TAILSCALE_VERSION / Multi-IP $MULTI_VERSION)"
                  elif [ "$BUILD_TAILSCALE" = true ]; then
                      TITLE="FTPD Tailscale $TAILSCALE_VERSION"
                  else
                      TITLE="Tethering FTPD Multi-IP $MULTI_VERSION"
                  fi

                  {
                      printf '# %s\n\n' "$TITLE"
                      printf '%s\n\n' '変更されたモジュールのZIPのみを収録しています。'
                      printf '%s\n' '## 配布ファイル'
                      if [ "$BUILD_TAILSCALE" = true ]; then
                          printf '%s\n' "- **FTPD-Tailscale.zip** — Tailscale / localhost FTP ($TAILSCALE_VERSION)"
                      fi
                      if [ "$BUILD_MULTI" = true ]; then
                          printf '%s\n' "- **Tethering_FTPD_Multi-IP.zip** — 指定IP・サブネットFTP ($MULTI_VERSION)"
                      fi
                      printf '\nCommit: \x60%s\x60\n' "$GITHUB_SHA"
                      if [ -n "$EXTRA_IPS" ]; then
                          printf '\nMulti-IPに追加した対象IP: \x60%s\x60\n' "$EXTRA_IPS"
                      fi
                  } > release-notes.md

                  if gh release view "$TAG" >/dev/null 2>&1; then
                      gh release upload "$TAG" "${ASSETS[@]}" --clobber
                      gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
                      if [ "$IS_DRAFT" = false ]; then
                          gh release edit "$TAG" --draft=false --latest
                      fi
                  elif [ "$IS_DRAFT" = true ]; then
                      gh release create "$TAG" "${ASSETS[@]}" \
                          --target "$GITHUB_SHA" \
                          --draft --latest=false \
                          --title "$TITLE" \
                          --notes-file release-notes.md
                  else
                      gh release create "$TAG" "${ASSETS[@]}" \
                          --target "$GITHUB_SHA" \
                          --latest \
                          --title "$TITLE" \
                          --notes-file release-notes.md
                  fi

                  if [ "$IS_DRAFT" = false ]; then
                      gh release edit "$TAG" --latest
                      LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
                      test "$LATEST_TAG" = "$TAG"
                      echo "Verified Latest GitHub Release: $LATEST_TAG"
                  fi
